# -----------------------------------------------------
# General workspace rules
# name: "Default"
# -----------------------------------------------------

workspace = name:Gaming, monitor:DP-1, border:0, rounding:0, decorate:0, gapsin:0, gapsout:0
workspace = special:messanger, on-created-empty: ferdium
workspace = special:spotify, on-created-empty: flatpak run com.spotify.Client
workspace = name:Alt, monitor:HDMI-A-1, border:0, rounding:0, decorate:0, gapsin:0, gapsout:0
workspace = name:social, layout:scrolling

# Assigning workspace to a certain monitor. Below are just examples
workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-1

